# 构建并推送后端镜像到 GitHub Packages:
#   ghcr.io/java131313/urlnote-server  urlnote-server 纯 API(+ IPADIC,日文分词)
# 前端镜像由 docker.yml 构建(带 OSS 编译期凭据,勿与本 workflow 重复)
#
# 运行时的连接配置全部是环境变量(Sealos / docker run 均可配):
#   前端镜像构建期: API_BASE=后端地址(可选 BASE_PATH,子路径部署用)
#   后端镜像运行时: MONGODB_URI / MONGO_DB / ADMIN_PASSWORD / CORS_ORIGINS / PORT
# 词典一次性导入(幂等):
#   docker run --rm ghcr.io/java131313/urlnote-server:latest /app/urlnote-server seed
name: build-and-push-server-ghcr

on:
  push:
    branches: [go-back]
    paths:
      - "Dockerfile.server"
      - "rust/**"
      - "react/**"
      - ".github/workflows/docker-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Sealos 对象存储(S3),与 docker.yml 同一套 Secrets/Variables。
  # 不设也能构建,/oss 页只显示“未配置”。注意:它们会被编译进公开的前端包。
  VITE_OSS_ENDPOINT: objectstorageapi.bja.sealos.run
  VITE_OSS_BUCKET: mpzfivcp-watchwonderful
  VITE_OSS_REGION: us-east-1
  VITE_OSS_AK: ${{ secrets.OSS_AK }}
  VITE_OSS_SK: ${{ secrets.OSS_SK }}

jobs:
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arm64 跨架构构建
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-react
          tags: |
            type=raw,value=latest
            type=sha
      - name: build & push react
        uses: docker/build-push-action@v6
        with:
          context: react
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_OSS_ENDPOINT=${{ env.VITE_OSS_ENDPOINT }}
            VITE_OSS_BUCKET=${{ env.VITE_OSS_BUCKET }}
            VITE_OSS_REGION=${{ env.VITE_OSS_REGION }}
            VITE_OSS_AK=${{ env.VITE_OSS_AK }}
            VITE_OSS_SK=${{ env.VITE_OSS_SK }}
          cache-from: type=gha,scope=react
          cache-to: type=gha,mode=max,scope=react

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=latest
            type=sha
      - name: build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
