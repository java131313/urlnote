name: Build and push frontend Docker image

# 构建前端（Rust/Leptos → WASM，Trunk）并打入 nginx 运行时镜像，
# 推送到 GitHub Container Registry（ghcr.io/java131313/urlnote-frontend）。
# 后端 API 仍由 Cloudflare Worker 提供，通过编译期 API_BASE 指过去；
# 镜像以根路径提供服务（BASE_PATH 为空）。

on:
  push:
    branches: [go-back]
    paths:
      - "rust/frontend/**"
      - "rust/shared/**"
      - "docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Cloudflare Worker 地址，在仓库 Settings → Secrets and variables →
  # Actions → Variables 中设置（与 Pages 工作流共用同一个变量）。
  API_BASE: ${{ vars.API_BASE }}
  # Sealos 对象存储（S3），同 Pages 工作流。AK/SK 用 Secrets；不设也能
  # 构建，/oss 页只显示“未配置”。注意：它们会被编译进公开的 WASM。
  OSS_ENDPOINT: objectstorageapi.bja.sealos.run
  OSS_BUCKET: mpzfivcp-watchwonderful
  OSS_REGION: us-east-1
  OSS_AK: ${{ secrets.OSS_AK }}
  OSS_SK: ${{ secrets.OSS_SK }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/urlnote-frontend

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # jetli/trunk-action 会因 /tmp 与 /home 跨文件系统 rename 报 EXDEV，
      # 直接下载官方 release 二进制。$GITHUB_PATH 只从下一步起生效，
      # 本步用完整路径验证。
      - name: Install trunk
        run: |
          set -euo pipefail
          mkdir -p "$HOME/trunk-bin"
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/trunk-bin"
          echo "$HOME/trunk-bin" >> "$GITHUB_PATH"
          "$HOME/trunk-bin/trunk" --version

      - name: Require API_BASE variable
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error title=Missing variable::Set API_BASE in Settings → Secrets and variables → Actions → Variables, e.g. https://urlnote.<subdomain>.workers.dev"
            exit 1
          fi

      # 取 vditor 运行时与 import 转换库（与 Makefile 的 rust-static 目标一致）
      - name: Stage runtime assets
        run: |
          npm --prefix rust/frontend ci --no-audit --no-fund
          rm -rf rust/frontend/static/vditor rust/frontend/static/mammoth rust/frontend/static/turndown rust/frontend/static/pdfjs
          mkdir -p rust/frontend/static/vditor rust/frontend/static/mammoth rust/frontend/static/turndown rust/frontend/static/pdfjs
          cp -R rust/frontend/node_modules/vditor/dist rust/frontend/static/vditor/dist
          cp rust/frontend/node_modules/mammoth/mammoth.browser.min.js rust/frontend/static/mammoth/
          cp rust/frontend/node_modules/turndown/dist/turndown.js rust/frontend/static/turndown/
          cp rust/frontend/node_modules/pdfjs-dist/legacy/build/pdf.min.js \
             rust/frontend/node_modules/pdfjs-dist/legacy/build/pdf.worker.min.js \
             rust/frontend/static/pdfjs/

      # 根路径部署：不加 --public-url；API_BASE 编译进 WASM
      - name: Build frontend (WASM)
        working-directory: rust/frontend
        run: trunk build --release

      # Trunk 0.22 不再自动拷贝 static/（与 Makefile 的 rust-frontend 目标一致）
      - name: Stage static assets into dist
        run: |
          rm -rf rust/frontend/dist/vditor rust/frontend/dist/mammoth rust/frontend/dist/turndown rust/frontend/dist/pdfjs
          cp -R rust/frontend/static/vditor rust/frontend/dist/vditor
          cp -R rust/frontend/static/mammoth rust/frontend/dist/mammoth
          cp -R rust/frontend/static/turndown rust/frontend/dist/turndown
          cp -R rust/frontend/static/pdfjs rust/frontend/dist/pdfjs
          mkdir -p rust/frontend/dist/dict
          cp -R rust/frontend/static/dict/. rust/frontend/dist/dict/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
