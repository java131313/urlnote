# Render Blueprint:urlnote 免费档单 Pod 全栈
#
#   导入:Render Dashboard → New → Blueprint → 选本仓库 → Apply
#   然后手动补一个环境变量(Blueprint 建不了外部资源):
#     Dashboard → urlnote → Environment → FERRETDB_POSTGRESQL_URL
#     = Neon 控制台 "Direct connection" 连接串(以 postgresql:// 开头)
#
# 架构(免费):
#   Neon 免费 PostgreSQL(0.5GB,数据真身,GitHub 登录即开)
#     ▲
#   urlnote Web(免费档,仅 Oregon;单容器内:FerretDB :27017 + urlnote-server :8080)
#     FerretDB 把 MongoDB 线协议翻译成 PG —— 服务端代码零改动
#
# 免费档限制:15 分钟无访问休眠(首次打开 ~10s 冷启动);
# 图片建议存 Sealos S3(0.5GB 存不下多少图);区域只有美西。
services:
  - type: web
    name: urlnote
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /
    envVars:
      # Neon Dashboard → Connection Details → "Direct connection"(非 pooled!)
      - key: FERRETDB_POSTGRESQL_URL
        sync: false
      - key: MONGO_DB
        value: urlnote
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://java131313.github.io
      - key: OFFICE_SERVER_URL
        value: https://qkrvktsrtwmd.sealosbja.site
