server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Trunk emits content-hashed file names — cache them long, immutable.
    # (index.html itself must stay uncached so new hashes are picked up.)
    location ~* \.(?:js|css|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any path is a note id, served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
