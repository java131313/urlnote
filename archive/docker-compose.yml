services:
  mysql:
    image: mysql:8.0
    container_name: urlnote-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: urlnote
      MYSQL_USER: urlnote
      MYSQL_PASSWORD: urlnote
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:                 # uncomment for direct mysql access from the host
      - "3306:3306"

  backend:
    build: ./backend
    container_name: urlnote-backend
    restart: unless-stopped
    environment:
      PORT: 3007
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: urlnote
      DB_PASSWORD: urlnote
      DB_NAME: urlnote
    depends_on:
      mysql:
        condition: service_healthy
    # ports:                 # uncomment for direct backend access from the host
    #   - "3007:3007"

  frontend:
    build: ./frontend
    container_name: urlnote-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql-data:
