[package]
name = "urlnote-desktop"
version = "0.1.0"
edition = "2021"
description = "urlnote macOS 原生桌面版(eframe/egui + reqwest,直连 urlnote-server API,功能与 Web 版对齐)"

[dependencies]
eframe = "0.31"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "cookies",
  "rustls-tls",
  "multipart",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
quick-xml = "0.37"
shared = { path = "../shared" }
