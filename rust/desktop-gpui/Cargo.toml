[package]
name = "urlnote-desktop-gpui"
version = "0.1.0"
edition = "2021"
description = "urlnote macOS 原生桌面版(GPUI 重写:登录/便签/文件库/画图/Vditor 桥)"

[[bin]]
name = "urlnote-desktop"
path = "src/main.rs"

[dependencies]
gpui = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "cookies",
  "rustls-tls",
  "multipart",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
quick-xml = "0.37"
tiny_http = "0.12"
shared = { path = "../shared" }
