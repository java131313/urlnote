[package]
name = "urlnote-worker"
version = "0.1.0"
edition = "2021"
description = "urlnote Cloudflare Worker — Rust port of the original Go backend (main.go)"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto"] }
shared = { path = "../shared" }
lru = "0.12"
url = "2"
jieba-rs = "0.6"
vibrato = { version = "0.5", default-features = false }
ruzstd = "0.7"
