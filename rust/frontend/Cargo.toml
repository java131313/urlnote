[package]
name = "urlnote-frontend"
version = "0.1.0"
edition = "2021"
description = "urlnote frontend — Rust/Leptos port of the original Vue app, embedding the Vditor editor"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-events = "0.2"
web-sys = { version = "0.3", features = [
    "Blob",
    "console",
    "BlobPropertyBag",
    "Crypto",
    "Document",
    "DomRect",
    "DomRectList",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "History",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "Navigator",
    "Node",
    "NodeList",
    "Range",
    "RequestCredentials",
    "Selection",
    "Url",
    "Window",
] }
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
shared = { path = "../shared" }
